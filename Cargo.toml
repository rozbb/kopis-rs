[package]
name = "kopis"
authors = ["Michael Rosenberg <michael@mrosenberg.pub>"]
license = "MIT/Apache-2.0"
version = "0.1.0"
edition = "2024"
keywords = ["cryptography", "crypto", "post-quantum", "encapsulation", "kem"]
categories = ["cryptography", "no-std"]

[dependencies]
turboshake = { version = "0.7", default-features = false }
subtle = { version = "2.6", default-features = false, features = [
    "const-generics",
] }
zeroize = { version = "1", default-features = false, features = ["derive"] }
kem = "0.3.0"

[dev-dependencies]
rand = "0.10"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
libcrux-ml-kem = { version = "=0.0.10", features = ["mlkem512", "mlkem768", "mlkem1024"] }
graviola = "=0.4.1"
sha3 = "0.12.0"
shake = "0.1.0"
aws-lc-rs = "1.17.3"
mlkem-selkie = { git = "https://github.com/selkie-cryptography/mlkem-selkie", rev = "9acffbf58ea2fc8c2258ed2ee1c2731d631be934" }

[[bench]]
name = "all"
harness = false

[[bench]]
name = "noic"
harness = false

# `ct-check` is the constant-time validation harness (see ct-check.sh). It is a separate crate so
# that the `unsafe` its Valgrind client requests need stays out of kopis, which forbids it.
[workspace]
members = ["ct-check", "ct-check/probe"]

# What ct-check.sh builds: release codegen, because a debug build's constant-time behaviour says
# nothing about the one that ships, plus symbols so Valgrind reports name the offending function.
[profile.ct]
inherits = "release"
debug = 2

[patch.crates-io]
# Needed for benching against the hidden derandomized API in aws-lc-rs
aws-lc-rs = { git = "https://github.com/rozbb/aws-lc-rs.git", branch = "mlkem-derand" }
aws-lc-sys = { git = "https://github.com/rozbb/aws-lc-rs.git", branch = "mlkem-derand" }
# mlkem-selkie pulls sha3-selkie from crates.io, and the published 0.0.0 predates the
# `SHA3_SELKIE_BACKEND` env var that bench.sh's serial leg forces the portable Keccak with — so this
# one has to be a patch
sha3-selkie = { git = "https://github.com/selkie-cryptography/sha3-selkie", rev = "e769dcea3da3952f06b21414f53a392771d024bb" }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3"
