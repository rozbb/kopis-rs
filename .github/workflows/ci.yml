name: CI

on:
  push:
    branches: [ '**' ]
    paths-ignore: ["README.md"]
  pull_request:
    branches: [ '**' ]
    paths-ignore: ["README.md"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  # Test every backend forcibly, then test autodetect on Ubuntu and macOS
  test:
    name: Test (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: serial
            os: ubuntu-latest
            flags: '--cfg kopis_backend="serial"'
          - backend: avx2
            os: ubuntu-latest
            flags: '-C target-feature=+avx2 --cfg kopis_backend="avx2"'
          - backend: neon
            os: macos-latest
            flags: '-C target-feature=+sha3 --cfg kopis_backend="neon"'
          - backend: autodetect
            os: ubuntu-latest
            flags: ''
          - backend: autodetect
            os: macos-latest
            flags: ''
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        env:
          RUSTFLAGS: '-D warnings ${{ matrix.flags }}'

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  # Build every backend for a nostd target
  build-nostd:
    name: Build no_std (${{ matrix.backend }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: serial
            target: thumbv7em-none-eabi
            flags: '--cfg kopis_backend="serial"'
          - backend: neon
            target: aarch64-unknown-none
            flags: '-C target-feature=+sha3 --cfg kopis_backend="neon"'
          - backend: avx2
            target: x86_64-unknown-none
            flags: '-C target-feature=-soft-float,+sse,+sse2,+avx,+avx2 --cfg kopis_backend="avx2"'
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }} --release
        env:
          RUSTFLAGS: '-D warnings ${{ matrix.flags }}'

  # Run ct-check.sh on all backends
  constant-time:
    name: Constant-time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools ships llvm-objdump, which phase 2 needs: the system objdump is built for
          # one architecture and silently disassembles nothing for the cross targets.
          components: llvm-tools
          targets: aarch64-unknown-none, thumbv7em-none-eabi
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # Guards against the harness silently checking nothing: this runs deliberately leaky code
      # and fails if valgrind stays quiet. Without it a broken shim looks like a clean bill.
      - name: Self-test (must detect a planted leak)
        run: ./ct-check.sh --selftest
      # Do a binary scan once. This covers all backends
      - name: instruction scan (all targets)
        run: ./ct-check.sh --scan-only
      # Now do Valgrind tests on serial and AVX2. No support on macOS
      - name: valgrind / serial
        run: ./ct-check.sh --backend serial --no-scan
      - name: valgrind / avx2
        run: ./ct-check.sh --backend avx2 --no-scan

  # Check that `./extract_rust_to_lean.sh` has been run on the latest code changes
  rust-to-lean-extraction:
    name: Extraction is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      # ~120 MB of prebuilt aeneas + charon, keyed on the release the script pins.
      - name: Cache aeneas binaries
        uses: actions/cache@v4
        with:
          path: .aeneas-bin
          key: aeneas-${{ hashFiles('AENEAS_VERSION.txt') }}
      # charon compiles core/std with full MIR, then the crate and every dependency against
      # them, into its own target dir. Caching it is the difference between minutes and tens.
      - name: Cache charon target dir
        uses: actions/cache@v4
        with:
          path: target/charon
          key: charon-${{ hashFiles('AENEAS_VERSION.txt', 'Cargo.lock') }}
          restore-keys: charon-
      - run: ./extract_rust_to_lean.sh
      - name: Committed extraction matches
        run: |
          if ! git diff --exit-code -- lean/ExtractedRust*.lean; then
            echo
            echo "The committed extraction is stale. Run ./extract_rust_to_lean.sh and commit"
            echo "the result alongside the src/ change that caused this."
            exit 1
          fi

  # Build the Lean proofs
  lean:
    name: Lean proofs and model checks
    runs-on: ubuntu-latest
    # A cold build is hours; a warm one is minutes. The cache below makes the common case warm.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Keyed on every Lean source and on the manifest, which carries the pinned aeneas revision;
      # restore-keys falls back to the newest build for this toolchain, which lake then updates
      # incrementally.
      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.elan
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Pinned aeneas matches AENEAS_VERSION.txt
        run: |
          want=$(tr -d '[:space:]' < AENEAS_VERSION.txt)
          got=$(python3 -c "import json;print([p['inputRev'] for p in json.load(open('lean/lake-manifest.json'))['packages'] if p['name']=='aeneas'][0])")
          if [ "$want" != "$got" ]; then
            echo "AENEAS_VERSION.txt is '$want' but lean/lake-manifest.json pins '$got'."
            echo "Refresh it with:  cd lean && rm -rf .lake/config && lake update aeneas"
            exit 1
          fi
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      # The twin proof stacks are checked in *and* generated. Regenerating and diffing catches a
      # stale committed copy, which `make prove-kopis` would otherwise silently overwrite.
      - name: Generated twins match the committed ones
        run: |
          make -C lean twins
          git diff --exit-code -- lean/Kopis/Avx2/Properties lean/Kopis/Neon/Properties
      # Proves all three backends and runs TrustBase, which fails if the axiom footprint is not
      # exactly the audited list. Also fails if the generated audit surfaces are out of date.
      - name: Prove
        working-directory: lean
        run: make prove-kopis
      - name: Spec known-answer tests
        working-directory: lean
        run: make test-kopis-spec
      - name: AVX2 intrinsic models vs recorded vectors
        working-directory: lean
        run: make test-avx2-model
      - name: NEON intrinsic models vs recorded vectors
        working-directory: lean
        run: make test-neon-model
