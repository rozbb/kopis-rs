name: CI

on:
  push:
    branches: [ '**' ]
    paths-ignore: ["README.md"]
  pull_request:
    branches: [ '**' ]
    paths-ignore: ["README.md"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  test:
    name: Test on Rust stable
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo test

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features -- -D warnings

  # Test no_std build-only
  build-nostd:
    name: Build on no_std target (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@cargo-hack
      # No default features build
      - name: no_std / no feat
        run: cargo build --target thumbv7em-none-eabi --release --no-default-features
      - name: no_std / cargo hack
        run: cargo hack build --target thumbv7em-none-eabi --release --each-feature --exclude-features default,std

  # The serial backend is what gets extracted to Lean, so it has to keep building and passing
  # on its own — an x86 runner would otherwise only ever exercise the AVX2 paths.
  backends:
    name: Test each backend explicitly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: serial
        run: cargo test
        env:
          RUSTFLAGS: '-D warnings --cfg kopis_backend="serial"'
      - name: avx2 (forced, no runtime detection)
        run: cargo test
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+avx2 --cfg kopis_backend="avx2"'

  # Constant-time validation: run the public API under Valgrind with every secret byte tagged as
  # undefined memory, so a branch or a memory address that depends on one becomes a hard error.
  # Both x86 backends are checked because the AVX2 code is written by hand and the serial code is
  # what gets extracted to Lean; a leak in either is a leak. NEON is NOT covered here: valgrind
  # interprets the guest ISA, so it needs a real AArch64 runner with FEAT_SHA3 to check it.
  constant-time:
    name: Constant-time (valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # Guards against the harness silently checking nothing: this runs deliberately leaky code
      # and fails if valgrind stays quiet. Without it a broken shim looks like a clean bill.
      - name: Self-test (must detect a planted leak)
        run: ./ct-check.sh --selftest
      - name: serial
        run: ./ct-check.sh --backend serial
      - name: avx2
        run: ./ct-check.sh --backend avx2
