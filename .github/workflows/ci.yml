name: CI

on:
  push:
    branches: [ '**' ]
    paths-ignore: ["README.md"]
  pull_request:
    branches: [ '**' ]
    paths-ignore: ["README.md"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  test:
    name: Test on Rust stable
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo test

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features -- -D warnings

  # Test no_std build-only
  build-nostd:
    name: Build on no_std target (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@cargo-hack
      # No default features build
      - name: no_std / no feat
        run: cargo build --target thumbv7em-none-eabi --release --no-default-features
      - name: no_std / cargo hack
        run: cargo hack build --target thumbv7em-none-eabi --release --each-feature --exclude-features default,std

  # The serial backend is what gets extracted to Lean, so it has to keep building and passing
  # on its own — an x86 runner would otherwise only ever exercise the AVX2 paths.
  backends:
    name: Test each backend explicitly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: serial
        run: cargo test
        env:
          RUSTFLAGS: '-D warnings --cfg kopis_backend="serial"'
      - name: avx2 (forced, no runtime detection)
        run: cargo test
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+avx2 --cfg kopis_backend="avx2"'

  # Constant-time validation: run the public API under Valgrind with every secret byte tagged as
  # undefined memory, so a branch or a memory address that depends on one becomes a hard error.
  # Both x86 backends go through valgrind, because the AVX2 code is written by hand and the serial
  # code is what gets extracted to Lean; a leak in either is a leak. NEON gets the instruction
  # scan only — valgrind interprets the guest ISA, so checking it properly needs a real AArch64
  # runner with FEAT_SHA3.
  constant-time:
    name: Constant-time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools ships llvm-objdump, which phase 2 needs: the system objdump is built for
          # one architecture and silently disassembles nothing for the cross targets.
          components: llvm-tools
          targets: aarch64-unknown-none, thumbv7em-none-eabi
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # Guards against the harness silently checking nothing: this runs deliberately leaky code
      # and fails if valgrind stays quiet. Without it a broken shim looks like a clean bill.
      - name: Self-test (must detect a planted leak)
        run: ./ct-check.sh --selftest
      # Phase 1 only; the instruction scan does not depend on which backend the harness was
      # built against, so it runs once at the end rather than twice here.
      - name: valgrind / serial
        run: ./ct-check.sh --backend serial --no-scan
      - name: valgrind / avx2
        run: ./ct-check.sh --backend avx2 --no-scan
      # Phase 2 covers every target we can cross-compile to, including the NEON backend that
      # valgrind cannot run on an x86 runner.
      - name: instruction scan (all targets)
        run: ./ct-check.sh --scan-only

  # The Lean proofs. Everything here runs on a stock x86 runner: the two model checks replay
  # committed vectors through the Lean models rather than executing SIMD, so neither needs an
  # AVX2 or AArch64 host. Only *recording* those vectors does — see lean/README.md.
  lean:
    name: Lean proofs and model checks
    runs-on: ubuntu-latest
    # A cold build is hours; a warm one is minutes. The cache below makes the common case warm.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Keyed on every Lean source and on the manifest, which carries the pinned aeneas revision;
      # restore-keys falls back to the newest build for this toolchain, which lake then updates
      # incrementally.
      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.elan
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      # AENEAS_VERSION.txt is the single source of truth for the aeneas release: the extractor
      # downloads that release's binaries and the lakefile depends on that release's Lean backend.
      # The manifest can go stale behind it, because `include_str` bakes the file's contents into
      # lake's cached config and that cache does not track the included file — so editing the file
      # alone is not enough. Without this check a build would silently prove against a different
      # aeneas than the one that produced the extraction.
      - name: Pinned aeneas matches AENEAS_VERSION.txt
        run: |
          want=$(tr -d '[:space:]' < AENEAS_VERSION.txt)
          got=$(python3 -c "import json;print([p['inputRev'] for p in json.load(open('lean/lake-manifest.json'))['packages'] if p['name']=='aeneas'][0])")
          if [ "$want" != "$got" ]; then
            echo "AENEAS_VERSION.txt is '$want' but lean/lake-manifest.json pins '$got'."
            echo "Refresh it with:  cd lean && rm -rf .lake/config && lake update aeneas"
            exit 1
          fi
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      # The twin proof stacks are checked in *and* generated. Regenerating and diffing catches a
      # stale committed copy, which `make prove-kopis` would otherwise silently overwrite.
      - name: Generated twins match the committed ones
        run: |
          make -C lean twins
          git diff --exit-code -- lean/Kopis/Avx2/Properties lean/Kopis/Neon/Properties
      # Proves all three backends and runs TrustBase, which fails if the axiom footprint is not
      # exactly the audited list. Also fails if the generated audit surfaces are out of date.
      - name: Prove
        working-directory: lean
        run: make prove-kopis
      - name: Spec known-answer tests
        working-directory: lean
        run: make test-kopis-spec
      - name: AVX2 intrinsic models vs recorded vectors
        working-directory: lean
        run: make test-avx2-model
      - name: NEON intrinsic models vs recorded vectors
        working-directory: lean
        run: make test-neon-model
